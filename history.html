<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18"><title>History</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111a29;--line:#263247;--muted:#8997ad;--text:#edf2fb;--accent:#9b8cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% -15%,#242044 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
.shell{width:min(900px,100% - 40px);margin:0 auto;padding:38px 0 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #202b3e}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#a99cff,#6d62d8);display:grid;place-items:center;color:#101322;font-size:18px;font-weight:900;box-shadow:0 7px 24px #8174ff30}
.brand strong{display:block;font-size:18px;letter-spacing:-.025em}
.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px;letter-spacing:.04em}
.btn{border:1px solid var(--line);background:#151f30;color:var(--text);border-radius:11px;padding:9px 13px;font-weight:650;transition:background .18s,border-color .18s}
.btn:hover{background:#202b40;border-color:#7469c9}
.btn:disabled{opacity:.5;cursor:wait}
.status{color:var(--muted);font-size:12px;margin:0 2px 14px;min-height:18px}
.day{margin:24px 0 10px;color:#aebbd0;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.day:after{content:"";height:1px;background:var(--line);flex:1}
.list-card{overflow:hidden;background:linear-gradient(145deg,#121d2d,#0f1725);border:1px solid var(--line);border-radius:16px}
.entry{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:13px;align-items:center;padding:14px 16px;border-bottom:1px solid #202b3d;transition:background .18s}
.entry:last-child{border-bottom:0}
.entry:hover{background:#192538}
.favicon{width:36px;height:36px;border-radius:11px;background:#202b40;display:grid;place-items:center;overflow:hidden;border:1px solid #34415a}
.favicon img{width:21px;height:21px;object-fit:contain}
.favicon span{font-size:17px;color:#a9b8d0}
.main{min-width:0}
.titleline strong{display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain{font-size:12px;color:#a7b5cc;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url{font-size:11px;color:#71839e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.meta{text-align:right;white-space:nowrap;color:#aab6ca;font-size:12px}
.meta span{display:block}
.meta .mdate{font-size:11px;color:#8492a8;margin-bottom:1px}
.meta small{display:block;color:#8492a8;font-size:10px;margin-top:4px}
.meta a{color:#b8c4d8!important;text-decoration:none}
.meta a:hover{color:#c9c0ff!important}
.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
.load-wrap{text-align:center;padding:20px}
.hidden{display:none!important}
.error{color:#ff9aaf}
@media(max-width:620px){
 .shell{width:calc(100% - 26px);padding:22px 0 44px}
 .top{margin-bottom:22px}
 .entry{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:13px}
 .favicon{width:34px;height:34px}
 .meta{grid-column:2;text-align:left;display:flex;gap:9px;align-items:center;margin-top:-4px}
 .meta small{margin:0}
 .titleline strong{font-size:13px}
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">H</div>
    <div><strong>History</strong><small>Registro de actividad</small></div>
  </div>
  <button id="refresh" class="btn" type="button" title="Actualizar" aria-label="Actualizar">↻</button>
</header>
<main id="appView">
  <div id="status" class="status">Conectando…</div>
  <div id="historyList"></div>
  <div class="load-wrap"><button id="loadMore" class="btn hidden" type="button">Cargar más</button></div>
</main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(() => {
'use strict';
const firebaseConfig={apiKey:'AIzaSyBU8DyN2kRcDq0fxB20qRUXWBHV0E-0d6A',authDomain:'startab-44e48.firebaseapp.com',projectId:'startab-44e48',storageBucket:'startab-44e48.firebasestorage.app',messagingSenderId:'874084877753',appId:'1:874084877753:web:cf9cbe9a344356dc9be268'};
const TARGET_UID='YzDsdOCOuPZzKvjkmK6wUMrTo3s2', PAGE_SIZE=100;
const $=id=>document.getElementById(id);let db,entries=[],lastDoc=null,hasMore=false,loading=false,filter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stamp(e){if(Number.isFinite(Number(e.clientAt)))return Number(e.clientAt);if(e.visitedAt?.toMillis)return e.visitedAt.toMillis();if(Number.isFinite(Number(e.visitedAt?.seconds)))return e.visitedAt.seconds*1000;return 0}
function dateLabel(ms){const d=new Date(ms),n=new Date(),y=new Date();y.setDate(n.getDate()-1);const same=(a,b)=>a.toDateString()===b.toDateString();if(same(d,n))return'Hoy';if(same(d,y))return'Ayer';return new Intl.DateTimeFormat('es-DO',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}
function dateShort(ms){return new Intl.DateTimeFormat('es-DO',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(ms))}
function timeLabel(ms){return new Intl.DateTimeFormat('es-DO',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(new Date(ms))}
function favicon(e){if(e.favicon&&/^(https?:|data:image\/)/i.test(e.favicon))return e.favicon;try{return 'https://www.google.com/s2/favicons?sz=64&domain='+encodeURIComponent(new URL(e.url).hostname)}catch{return ''}}
function setStatus(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
function render(){
 const list=entries.slice().sort((a,b)=>stamp(b)-stamp(a));
 if(!list.length){
  $('historyList').innerHTML='<div class="list-card empty"><b>No hay registros</b>Cuando existan visitas guardadas aparecerán aquí.</div>';
  $('loadMore').classList.toggle('hidden',!hasMore);
  return;
 }
 const groups=new Map();
 for(const e of list){const k=dateLabel(stamp(e));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}
 $('historyList').innerHTML=[...groups].map(([day,items])=>`<div class="day">${esc(day)}</div><div class="list-card">${items.map(e=>{
  const url=safeUrl(e.url),search=e.type==='search'&&e.searchQuery,title=search?e.searchQuery:(e.title||e.domain||e.url||'Página visitada'),domain=e.domain||safeHost(e.url),ico=favicon(e);
  return `<article class="entry"><div class="favicon">${ico?`<img src="${esc(ico)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span>↗</span>'">`:'<span>↗</span>'}</div><div class="main"><div class="titleline"><strong title="${esc(title)}">${esc(title)}</strong></div><div class="domain">${esc(domain||'')}</div><div class="url">${esc(e.url||'')}</div></div><div class="meta"><span class="mdate">${esc(dateShort(stamp(e)))}</span><span class="mtime">${esc(timeLabel(stamp(e)))}</span><small>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`:'URL no disponible'}</small></div></article>`
 }).join('')}</div>`).join('');
 $('loadMore').classList.toggle('hidden',!hasMore);
}
function safeUrl(v){try{const u=new URL(String(v||''));return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}function safeHost(v){try{return new URL(v).hostname}catch{return ''}}
async function load(reset=false){if(loading)return;loading=true;$('refresh').disabled=true;$('loadMore').disabled=true;if(reset){entries=[];lastDoc=null;hasMore=true}setStatus('Actualizando…');try{let q=db.collection('users').doc(TARGET_UID).collection('history').orderBy('clientAt','desc').limit(PAGE_SIZE);if(!reset&&lastDoc)q=q.startAfter(lastDoc);const snap=await q.get();const page=snap.docs.map(d=>({id:d.id,...d.data()}));entries=reset?page:entries.concat(page);lastDoc=snap.docs[snap.docs.length-1]||lastDoc;hasMore=snap.size===PAGE_SIZE;setStatus('');render()}catch(err){console.error(err);const msg=err.code==='permission-denied'?'No se pudo obtener el historial. Comprueba la conexión y la configuración de Firebase.':(err.message||'No se pudo consultar Firebase.');setStatus(msg,true);if(!entries.length)$('historyList').innerHTML=`<div class="list-card empty"><b>No se pudo cargar el historial</b>${esc(msg)}</div>`}finally{loading=false;$('refresh').disabled=false;$('loadMore').disabled=false}}
try{
firebase.initializeApp(firebaseConfig);
db=firebase.firestore();
void load(true);
}catch(e){
setStatus('No se pudo inicializar Firebase: '+e.message,true);
$('historyList').innerHTML=`<div class="list-card empty"><b>Error de conexión</b>${esc(e.message)}</div>`;
}
$('refresh').addEventListener('click',()=>void load(true));$('loadMore').addEventListener('click',()=>void load(false));
})();
</script>
</body></html>
