<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18"><title>History</title>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#101827;--panel2:#141f31;--line:#26334a;--muted:#8d9bb2;--text:#eef3ff;--accent:#8b7cff;--accent2:#54d6c7;--danger:#ff9aaf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#292452 0,transparent 38%),radial-gradient(ellipse at 100% 0,#12313a 0,transparent 28%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:38px 24px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#8b7cff,#48d7c7);display:grid;place-items:center;color:#07111b;font-weight:900;font-size:19px;box-shadow:0 8px 30px #7365ff44}.brand small,.eyebrow{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:10px;font-weight:800}.brand strong{display:block;font-size:15px;letter-spacing:.02em}.btn{border:1px solid var(--line);background:#172236;color:var(--text);border-radius:11px;padding:10px 14px;font-weight:700;transition:.2s}.btn:hover{border-color:#756bda;background:#202d45}.btn.primary{background:linear-gradient(135deg,#8b7cff,#6258d9);border:0;color:white}.status{color:var(--muted);font-size:12px;margin:0 3px 12px;min-height:18px}.day{margin:22px 0 10px;color:#aebbd0;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:10px}.day:after{content:"";height:1px;background:var(--line);flex:1}.list-card{overflow:hidden}.entry{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:13px;align-items:center;padding:14px 17px;border-bottom:1px solid #202c40;transition:background .18s}.entry:last-child{border-bottom:0}.entry:hover{background:#19263a}.favicon{width:38px;height:38px;border-radius:12px;background:#202b40;display:grid;place-items:center;overflow:hidden;border:1px solid #34415a}.favicon img{width:22px;height:22px;object-fit:contain}.favicon span{font-size:17px;color:#a9b8d0}.main{min-width:0}.titleline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.titleline strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.domain{font-size:12px;color:#a7b5cc;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.url{font-size:11px;color:#71839e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.meta{text-align:right;white-space:nowrap;color:#aab6ca;font-size:12px}.meta small{display:block;color:#6f809b;font-size:10px;margin-top:3px}.tag{font-size:9px;letter-spacing:.08em;font-weight:900;padding:3px 7px;border-radius:6px}.tag.incog{background:#3b2943;color:#f0b8ff;border:1px solid #71447d}.tag.search{background:#1c3542;color:#9be5ed;border:1px solid #315b67}.open{color:inherit;text-decoration:none;display:contents}.open:hover .titleline strong{color:#c5bcff}.empty{padding:54px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.login-wrap{max-width:510px;margin:80px auto}.login-card{padding:34px;text-align:center}.login-card h2{margin:10px 0}.login-card p{color:var(--muted);margin:0 0 23px}.login-card .btn{width:100%;padding:13px}.warning{font-size:11px!important;margin-top:16px!important}.load-wrap{text-align:center;padding:20px}.hidden{display:none!important}.error{color:#ff9aaf}.foot{text-align:center;color:#62728c;font-size:11px;margin-top:34px}
@media(max-width:700px){.shell{padding:22px 13px 45px}.top{align-items:flex-start}.entry{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:13px}.favicon{width:34px;height:34px}.meta{grid-column:2;text-align:left;display:flex;gap:8px;align-items:center;margin-top:-5px}.meta small{margin:0}.titleline strong{font-size:13px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="logo">H</div><div><strong>History</strong></div></div></header>
<main id="appView">
<div id="status" class="status">Loading history…</div><div id="historyList"></div><div class="load-wrap"><button id="loadMore" class="btn hidden">Load more</button></div>
</main><footer class="foot">History</footer>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(() => {
'use strict';
const firebaseConfig={apiKey:'AIzaSyBU8DyN2kRcDq0fxB20qRUXWBHV0E-0d6A',authDomain:'startab-44e48.firebaseapp.com',projectId:'startab-44e48',storageBucket:'startab-44e48.firebasestorage.app',messagingSenderId:'874084877753',appId:'1:874084877753:web:cf9cbe9a344356dc9be268'};
const TARGET_UID='YzDsdOCOuPZzKvjkmK6wUMrTo3s2', PAGE_SIZE=100;
const $=id=>document.getElementById(id);let db,entries=[],lastDoc=null,hasMore=false,loading=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stamp(e){if(Number.isFinite(Number(e.clientAt)))return Number(e.clientAt);if(e.visitedAt?.toMillis)return e.visitedAt.toMillis();if(Number.isFinite(Number(e.visitedAt?.seconds)))return e.visitedAt.seconds*1000;return 0}
function dateLabel(ms){const d=new Date(ms),n=new Date(),y=new Date();y.setDate(n.getDate()-1);const same=(a,b)=>a.toDateString()===b.toDateString();if(same(d,n))return'Today';if(same(d,y))return'Yesterday';return new Intl.DateTimeFormat('es-DO',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}
function timeLabel(ms){return new Intl.DateTimeFormat('es-DO',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(new Date(ms))}
function favicon(e){if(e.favicon&&/^(https?:|data:image\/)/i.test(e.favicon))return e.favicon;try{return 'https://www.google.com/s2/favicons?sz=64&domain='+encodeURIComponent(new URL(e.url).hostname)}catch{return ''}}
function setStatus(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
function render(){
 const list=entries.slice().sort((a,b)=>stamp(b)-stamp(a));
 if(!list.length){
  $('historyList').innerHTML='<div class="list-card empty"><b>No history records</b>Saved visits will appear here.</div>';
  $('loadMore').classList.toggle('hidden',!hasMore);
  return;
 }
 const groups=new Map();
 for(const e of list){const k=dateLabel(stamp(e));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}
 $('historyList').innerHTML=[...groups].map(([day,items])=>`<div class="day">${esc(day)} <span style="color:#65758e">${items.length}</span></div><div class="list-card">${items.map(e=>{const url=safeUrl(e.url),search=e.type==='search'&&e.searchQuery,title=search?e.searchQuery:(e.title||e.domain||e.url||'Visited page'),domain=e.domain||safeHost(e.url),ico=favicon(e);return `<article class="entry"><div class="favicon">${ico?`<img src="${esc(ico)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span>↗</span>'">`:'<span>↗</span>'}</div><div class="main"><div class="titleline">${search?'<span class="tag search">SEARCH</span>':''}${e.incognito===true?'<span class="tag incog">INCOGNITO</span>':''}<strong title="${esc(title)}">${esc(title)}</strong></div><div class="domain">${esc(domain||'')}</div><div class="url">${esc(e.url||'')}</div></div><div class="meta">${esc(timeLabel(stamp(e)))}<small>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:#a9b7ce;text-decoration:none">Open ↗</a>`:'URL unavailable'}</small></div></article>`}).join('')}</div>`).join('');
 $('loadMore').classList.toggle('hidden',!hasMore);
}
function safeUrl(v){try{const u=new URL(String(v||''));return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}function safeHost(v){try{return new URL(v).hostname}catch{return ''}}
async function load(reset=false){if(loading)return;loading=true;$('loadMore').disabled=true;if(reset){entries=[];lastDoc=null;hasMore=true}setStatus('Loading history…');try{let q=db.collection('users').doc(TARGET_UID).collection('history').orderBy('clientAt','desc').limit(PAGE_SIZE);if(!reset&&lastDoc)q=q.startAfter(lastDoc);const snap=await q.get();const page=snap.docs.map(d=>({id:d.id,...d.data()}));entries=reset?page:entries.concat(page);lastDoc=snap.docs[snap.docs.length-1]||lastDoc;hasMore=snap.size===PAGE_SIZE;setStatus(`${entries.length.toLocaleString('en-US')} records loaded${hasMore?' · more available':''}`);render()}catch(err){console.error(err);const msg=err.code==='permission-denied'?'Unable to load history. Please check the connection and try again.':(err.message||'Unable to load history.');setStatus(msg,true);if(!entries.length)$('historyList').innerHTML=`<div class="list-card empty"><b>Unable to load history</b>${esc(msg)}</div>`}finally{loading=false;$('loadMore').disabled=false}}
try{
firebase.initializeApp(firebaseConfig);
db=firebase.firestore();
void load(true);
}catch(e){
setStatus('Unable to initialize: '+e.message,true);
$('historyList').innerHTML=`<div class="list-card empty"><b>Connection error</b>${esc(e.message)}</div>`;
}
$('loadMore').addEventListener('click',()=>void load(false));
})();
</script>
</body></html>
